<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Form</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Product Form</h2>
        <form th:action="@{/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}" />
            <div class="form-group">
                <label>Name</label>
                <input type="text" th:field="*{name}" class="form-control" required />
            </div>
            <div class="form-group">
                <label>Product Image</label>
                <input type="file" name="imageFile" class="form-control-file" accept="image/*" />
                <input type="hidden" th:field="*{image}" />
            </div>
            <div class="form-group">
                <label>Price</label>
                <input type="number" th:field="*{price}" class="form-control" required />
            </div>
            <div class="form-group">
                <label>Category</label>
                <select th:field="*{category.id}" class="form-control" required>
                    <option value="">Select Category</option>
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-success">Save Product</button>
            <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
