<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>403 - Access Denied</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .error-container { text-align: center; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .error-code { font-size: 72px; font-weight: bold; color: #dc3545; }
        .error-message { font-size: 24px; color: #343a40; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">403</div>
        <div class="error-message">Access Denied</div>
        <p class="text-muted">You do not have permission to access this page.</p>
        <p class="text-muted">This action is restricted to Administrators only.</p>
        <a th:href="@{/products}" class="btn btn-primary mt-3">Return to Products list</a>
    </div>
</body>
</html>
